version: "3.8"

services:
  # ==========================================
  # Base de données PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: clinicmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbClinic
      POSTGRES_USER: clinicuser
      POSTGRES_PASSWORD: mouawya1234
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script SQL d'initialisation (optionnel) — placez vos .sql dans ./docker/initdb/
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - clinicmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicuser -d clinicmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # pgAdmin 4 (interface web d'administration)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clinicmanager-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinicmanager.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - clinicmanager-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  clinicmanager-network:
    driver: bridge